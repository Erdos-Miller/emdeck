[package]
name = "emdeck-ide"
version = "0.1.20"
description = "A lightweight workspace for agent-driven development"
authors = ["Erdos Miller"]
edition = "2021"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Erdos-Miller/emdeck"
homepage = "https://github.com/Erdos-Miller/emdeck"

[lib]
name = "emdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tempfile = "3"
trash = "5"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[patch.crates-io]
# Backport gtk-rs#1343 while Tauri's GTK3 stack requires GLib 0.18.
glib = { path = "vendor/glib" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
