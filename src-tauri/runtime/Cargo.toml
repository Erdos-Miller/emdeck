[package]
name = "emdeck-session"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "Apache-2.0"
description = "Emdeck's independent, headless terminal session server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16.2"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory"] }
