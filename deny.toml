[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
# Reviewed upstream maintenance notices; no vulnerability advisories are waived.
# Revisit with each Tauri update. Details: docs/DEPENDENCIES.md.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "Linux GTK3 build macro via Tauri; upstream maintenance notice, no compatible replacement in this graph." },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range via Tauri urlpattern; upstream maintenance notice, no compatible replacement." },
  { id = "RUSTSEC-2025-0080", reason = "unic-common via Tauri urlpattern; upstream maintenance notice, no compatible replacement." },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property via Tauri urlpattern; upstream maintenance notice, no compatible replacement." },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version via Tauri urlpattern; upstream maintenance notice, no compatible replacement." },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident via Tauri urlpattern; upstream maintenance notice, no compatible replacement." },
]
unused-ignored-advisory = "deny"

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
