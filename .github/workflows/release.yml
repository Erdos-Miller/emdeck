name: Draft release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.20)
        type: string
        required: true
      signed:
        description: Require platform signing (disable only for an explicitly unsigned beta)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  package:
    needs: check
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      signed: ${{ github.event_name == 'push' || inputs.signed }}
    secrets: inherit
  draft:
    needs: [check, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EMDECK_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      EMDECK_SIGNED: ${{ (github.event_name == 'push' || inputs.signed) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: .tmp/release-assets/
      - name: Create draft beta with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/create-draft.mjs
