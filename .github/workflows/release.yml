name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.21)
        type: string
        required: true
      signed:
        description: Require platform signing (disable only for an explicitly unsigned beta)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  package:
    needs: check
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      signed: ${{ inputs.signed }}
    secrets: inherit
  draft:
    needs: [check, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EMDECK_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      EMDECK_SIGNED: ${{ inputs.signed && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: .tmp/release-assets/
      - name: Create draft beta with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/create-draft.mjs
