name: Security and licenses
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * 1"
permissions:
  contents: read
jobs:
  audit:
    name: Security and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: bun install --frozen-lockfile
      - run: bun run release:tools
      - run: bun run security:check
      - run: bun run security:rust
      - run: bun run licenses:generate
      - name: Verify committed notices are current
        run: git diff --exit-code -- docs/licenses/
      - run: bun run workflows:check
