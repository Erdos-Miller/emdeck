name: Package Emdeck
on:
  workflow_dispatch:
    inputs:
      signed:
        description: Require Windows signing and macOS signing/notarization
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      signed:
        type: boolean
        default: false
    secrets:
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
permissions:
  contents: read
jobs:
  package:
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      EMDECK_SIGNED: ${{ inputs.signed && 'true' || 'false' }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: package-${{ matrix.target }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run release:check
      - name: Prepare Windows signing
        if: runner.os == 'Windows' && inputs.signed
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/release/windows-signing.ps1
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:EMDECK_SIGNED -eq 'true') {
            bun run tauri build --target $env:RELEASE_TARGET --bundles nsis --config .tmp/windows-signing.json
          } else {
            bun run tauri build --target $env:RELEASE_TARGET --bundles nsis
          }
      - name: Build macOS
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ inputs.signed && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.signed && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.signed && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ inputs.signed && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.signed && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed && secrets.APPLE_TEAM_ID || '' }}
        run: |
          node scripts/release/macos-signing.mjs
          bun run tauri build --target "$RELEASE_TARGET" --bundles app,dmg
          codesign --verify --deep --strict "src-tauri/target/$RELEASE_TARGET/release/bundle/macos/Emdeck.app"
          if [ "$EMDECK_SIGNED" = 'true' ]; then
            spctl --assess --type execute --verbose "src-tauri/target/$RELEASE_TARGET/release/bundle/macos/Emdeck.app"
            xcrun stapler validate "src-tauri/target/$RELEASE_TARGET/release/bundle/macos/Emdeck.app"
          fi
      - name: Build Linux
        if: runner.os == 'Linux'
        run: bun run tauri build --target "$RELEASE_TARGET" --bundles deb,appimage
      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/windows-smoke.ps1 -Target $env:RELEASE_TARGET
      - name: Stage release assets
        run: node scripts/release/collect-assets.mjs ${{ matrix.label }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.label }}
          path: .tmp/release-assets/
          if-no-files-found: error
      - name: Remove Windows signing certificate
        if: always() && runner.os == 'Windows' && inputs.signed
        shell: pwsh
        run: |
          if ($env:EMDECK_CERT_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:EMDECK_CERT_THUMBPRINT" -ErrorAction SilentlyContinue
          }
