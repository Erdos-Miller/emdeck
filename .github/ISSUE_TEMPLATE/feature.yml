name: Feature request
description: Suggest an improvement to the agent workspace.
title: "[Feature]: "
labels: ["enhancement", "status: triage"]
body:
  - type: markdown
    attributes:
      value: For early ideas or questions, use Discussions. A request is a proposal, not a release commitment. Keep examples public or synthetic.
  - type: checkboxes
    id: existing
    attributes:
      label: Before requesting
      options:
        - label: I searched existing issues and Ideas discussions for this request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain how this fits a lightweight IDE without project indexing.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
      description: What do you do today, and why is it not enough?
  - type: input
    id: discussion
    attributes:
      label: Related discussion or issue
      description: Optional link to an existing conversation.
