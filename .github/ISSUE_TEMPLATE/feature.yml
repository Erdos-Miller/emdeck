name: Feature request
description: Suggest an improvement to the agent workspace.
body:
  - type: textarea
    id: problem
    attributes:
      label: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain how this fits a lightweight IDE without project indexing.
    validations:
      required: true
