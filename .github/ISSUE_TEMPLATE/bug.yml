name: Bug report
description: Report a reproducible problem in Emdeck.
title: "[Bug]: "
labels: ["bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private source, or agent transcripts. Report security issues using the Security tab.
  - type: checkboxes
    id: existing
    attributes:
      label: Before reporting
      options:
        - label: I searched existing issues for this problem.
          required: true
  - type: input
    id: version
    attributes:
      label: Emdeck version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Files or editor
        - Git or worktrees
        - Terminals or agents
        - Remote or background sessions
        - Run commands
        - Layout or appearance
        - Installation or updates
        - Other / unsure
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and processor
      placeholder: Windows 11 x64, macOS Apple Silicon, Ubuntu 24.04 x64…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a small public or synthetic project.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized logs
      description: Optional. Remove credentials, private paths, project contents, and agent conversations before attaching evidence.
